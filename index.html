<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>WebAI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#29224b,transparent 40%),#0b1020;color:#edf2ff;font:15px system-ui;height:100vh}button,textarea,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:250px 1fr;height:100vh}.side{background:#101a2c;border-right:1px solid #293750;padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-size:22px;font-weight:800;padding:8px}.brand b{color:#55d6cf}.new,.send{background:linear-gradient(110deg,#8274ff,#55b7d8);border:0;border-radius:10px;padding:11px;font-weight:700}.search,select{background:#0b1425;color:white;border:1px solid #30405b;border-radius:9px;padding:10px}.search{width:100%}.history{flex:1;overflow:auto}.chat{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;padding:10px;border-radius:8px;color:#cbd6e8}.chat:hover,.chat.active{background:#22314a}.chat small{color:#91a0b8}.settings{background:transparent;border:0;text-align:left;padding:10px}.main{display:flex;flex-direction:column;min-width:0}.top{height:65px;border-bottom:1px solid #293750;display:flex;justify-content:space-between;align-items:center;padding:0 22px}.top h1{font-size:15px}.content{flex:1;overflow:auto}.welcome{text-align:center;max-width:700px;margin:8vh auto;padding:20px}.orb{margin:0 auto 20px;width:65px;height:65px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#8d7cff,#55d6cf);color:#09101d;font-size:28px}.welcome h2{font-size:40px;margin:0}.welcome h2 span{color:#8dceec}.welcome p{color:#91a0b8}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}.idea{background:#142139;border:1px solid #293750;border-radius:12px;padding:15px;text-align:left}.idea small{display:block;color:#91a0b8}.messages{max-width:850px;margin:auto;padding:25px;display:flex;flex-direction:column;gap:18px}.msg{padding:13px 16px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#192842;align-self:flex-end;max-width:85%}.ai{align-self:stretch;background:#111c2f}.composer{padding:14px 20px}.box{max-width:850px;margin:auto;background:#121e31;border:1px solid #34445e;border-radius:15px;padding:12px}.box textarea{width:100%;background:transparent;border:0;color:white;resize:vertical;min-height:55px;outline:0}.foot{display:flex;justify-content:space-between;align-items:center;color:#91a0b8;font-size:11px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.modal{background:#142139;border:1px solid #34445e;border-radius:16px;padding:22px;width:min(460px,90vw)}.modal input,.modal textarea{display:block;width:100%;padding:10px;margin:8px 0 14px;background:#0b1425;color:white;border:1px solid #30405b;border-radius:9px}.modal p{color:#91a0b8;font-size:12px}.toast{position:fixed;bottom:15px;right:15px;background:#20314a;padding:12px;border-radius:10px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.ideas{grid-template-columns:1fr}.welcome h2{font-size:30px}.top{padding:0 12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">✳ Web<b>AI</b></div><button class="new" id="new">＋ New chat</button><input class="search" id="search" placeholder="Search chats"><div class="history" id="history"></div><button class="settings" id="settings">⚙ Settings & API key</button><button class="settings" id="clear">Clear conversations</button></aside><main class="main"><header class="top"><h1 id="title">New conversation</h1><div><select id="model"><option value="llama-3.3-70b-versatile">Llama 3.3 70B</option><option value="openai/gpt-oss-120b">GPT OSS 120B</option><option value="openai/gpt-oss-20b">GPT OSS 20B</option><option value="llama-3.1-8b-instant">Llama 3.1 8B</option></select> <button id="export">Export ↓</button></div></header><section class="content" id="content"><div class="welcome" id="welcome"><div class="orb">✳</div><h2>Your ideas, <span>meet intelligence.</span></h2><p>A focused AI workspace for thinking, building and learning.</p><div class="ideas"><button class="idea" data-p="Help me plan a modern website from scratch."><b>⌘ Build something</b><small>Plan an app or website</small></button><button class="idea" data-p="Explain a difficult topic simply, step by step."><b>✧ Learn something</b><small>Make complex ideas clear</small></button><button class="idea" data-p="Review my code and suggest improvements:"><b>⌁ Code assistant</b><small>Debug and improve code</small></button><button class="idea" data-p="Give me ten creative project ideas."><b>◈ Explore ideas</b><small>Brainstorm something new</small></button></div></div><div class="messages" id="messages" hidden></div></section><div class="composer"><div class="box"><textarea id="prompt" placeholder="Message WebAI..."></textarea><div class="foot"><span id="state">Groq · Add your API key in Settings</span><button class="send" id="send">Send ↑</button></div></div></div></main></div><div id="modal"></div><div id="toast"></div>
<script>
(function(){
var $=function(x){return document.getElementById(x)},KEY='webai.key',STORE='webai.chats',PREF='webai.prefs';
var key=localStorage.getItem(KEY)||'',chats=JSON.parse(localStorage.getItem(STORE)||'[]'),current=null,busy=false,controller=null,prefs=JSON.parse(localStorage.getItem(PREF)||'{}');
var defaultSystem='You are WebAI, a helpful, accurate and practical AI assistant. Be clear, thoughtful and use markdown when useful.';
$('model').value=prefs.model||'llama-3.3-70b-versatile';
function active(){return chats.find(function(c){return c.id===current})}
function save(){localStorage.setItem(STORE,JSON.stringify(chats));renderHistory()}
function toast(t){$('toast').innerHTML='<div class="toast"></div>';$('toast').firstChild.textContent=t;setTimeout(function(){$('toast').innerHTML=''},2500)}
function renderHistory(){var q=$('search').value.toLowerCase();$('history').innerHTML='';chats.filter(function(c){return c.title.toLowerCase().indexOf(q)>=0}).forEach(function(c){var b=document.createElement('button');b.className='chat'+(c.id===current?' active':'');var n=document.createElement('span');n.textContent=c.title;var d=document.createElement('small');d.textContent='×';d.onclick=function(e){e.stopPropagation();chats=chats.filter(function(x){return x.id!==c.id});if(current===c.id)current=null;save();render()};b.append(n,d);b.onclick=function(){current=c.id;render()};$('history').append(b)})}
function fresh(){var c={id:String(Date.now())+String(Math.random()),title:'New chat',messages:[]};chats.unshift(c);current=c.id;save();render()}
function render(){var c=active();$('welcome').hidden=!!(c&&c.messages.length);$('messages').hidden=!(c&&c.messages.length);$('messages').innerHTML='';$('title').textContent=c?c.title:'New conversation';if(c)c.messages.forEach(function(m){var d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'ai');d.textContent=m.content;$('messages').append(d)});renderHistory();$('content').scrollTop=$('content').scrollHeight}
function settings(){$('modal').innerHTML='<div class="modalbg"><div class="modal"><h2>WebAI settings</h2><p>Your Groq key is saved in this browser and sent directly to Groq. Anyone with access to this browser profile may inspect it. Never publish your key.</p><label>Groq API key</label><input id="keyinput" type="password" placeholder="gsk_..."><label>System instructions</label><textarea id="system" rows="4"></textarea><label>Creativity (0 to 2)</label><input id="temp" type="number" min="0" max="2" step=".1"><button class="send" id="save">Save</button> <button id="cancel">Cancel</button></div></div>';$('keyinput').value=key;$('system').value=prefs.system||defaultSystem;$('temp').value=prefs.temp===undefined?0.7:prefs.temp;$('save').onclick=function(){key=$('keyinput').value.trim();if(key)localStorage.setItem(KEY,key);else localStorage.removeItem(KEY);prefs.system=$('system').value||defaultSystem;prefs.temp=Math.max(0,Math.min(2,Number($('temp').value)));prefs.model=$('model').value;localStorage.setItem(PREF,JSON.stringify(prefs));$('modal').innerHTML='';$('state').textContent=key?'Groq API key saved':'Add your API key in Settings';toast('Settings saved')};$('cancel').onclick=function(){$('modal').innerHTML=''}}
async function send(){var text=$('prompt').value.trim();if(!text||busy)return;if(!key){settings();toast('Add your Groq API key first');return}if(!active())fresh();var c=active();c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=text.slice(0,34);$('prompt').value='';save();render();var reply={role:'assistant',content:''};c.messages.push(reply);var d=document.createElement('div');d.className='msg ai';$('messages').append(d);busy=true;controller=new AbortController();$('send').textContent='Stop ■';
try{var response=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:$('model').value,messages:[{role:'system',content:prefs.system||defaultSystem}].concat(c.messages.slice(0,-1)),temperature:prefs.temp===undefined?0.7:prefs.temp,max_tokens:4096,stream:true}),signal:controller.signal});if(!response.ok){var detail=await response.text();throw Error(response.status===401?'Invalid API key. Check Settings.':response.status===429?'Groq rate limit reached. Try again shortly.':'Groq API error '+response.status+': '+detail.slice(0,150))}var reader=response.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){var part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});var lines=buffer.split('\n');buffer=lines.pop();for(var i=0;i<lines.length;i++){var line=lines[i];if(line.indexOf('data: ')!==0||line.indexOf('[DONE]')>=0)continue;try{var data=JSON.parse(line.slice(6));var token=data.choices&&data.choices[0].delta.content;if(token){reply.content+=token;d.textContent=reply.content}}catch(e){}}}}
catch(e){if(e.name!=='AbortError'){reply.content='Error: '+e.message;d.textContent=reply.content}}
finally{busy=false;controller=null;$('send').textContent='Send ↑';save();render()}}
$('new').onclick=fresh;$('settings').onclick=settings;$('search').oninput=renderHistory;$('clear').onclick=function(){if(confirm('Delete all conversations?')){chats=[];current=null;save();render()}};$('send').onclick=function(){if(busy){if(controller)controller.abort()}else send()};$('prompt').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('model').onchange=function(){prefs.model=$('model').value;localStorage.setItem(PREF,JSON.stringify(prefs))};$('export').onclick=function(){var c=active();if(!c)return toast('No chat to export');var data=c.messages.map(function(m){return m.role.toUpperCase()+':\n'+m.content}).join('\n\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download='webai-chat.txt';a.click();URL.revokeObjectURL(a.href)};document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){$('prompt').value=b.getAttribute('data-p');$('prompt').focus()}});$('state').textContent=key?'Groq API key saved':'Groq · Add your API key in Settings';if(chats.length)current=chats[0].id;render();
})();
</script></body></html>
