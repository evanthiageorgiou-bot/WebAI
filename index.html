<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>WebAI</title></head><body style='margin:0;background:#0b1020;color:white;font:16px system-ui'><main style='max-width:900px;margin:10vh auto;padding:24px'><h1>WebAI</h1><p>Your personal AI workspace, powered by Groq.</p><textarea id='p' placeholder='Ask anything' style='width:100%;height:100px'></textarea><button id='s'>Send</button><pre id='out'></pre><script>document.getElementById('s').onclick=async()=>{const k=localStorage.getItem('webai.key');if(!k){const v=prompt('Enter your Groq API key');if(!v)return;localStorage.setItem('webai.key',v)}const out=document.getElementById('out');out.textContent='Thinking...';try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('webai.key')},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:document.getElementById('p').value}]})});const j=await r.json();out.textContent=j.choices[0].message.content}catch(e){out.textContent=String(e)}};</script></main></body></html>
